<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout Cancelled</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f7fb;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    max-width: 420px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  .icon { font-size: 3rem; margin-bottom: 10px; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  p { color: #6b6b76; }
  a {
    display: inline-block;
    margin-top: 20px;
    color: #635bff;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛒</div>
    <h1>Checkout Cancelled</h1>
    <p>No worries — your cart is still here if you'd like to try again.</p>
    <a href="/">← Back to shop</a>
  </div>
</body>
</html>
